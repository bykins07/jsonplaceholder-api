<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSONPlaceholder API Project</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>JSONPlaceholder API</h1>
        <p>Posts fetched from a REST API</p>
    </header>

    <section class="controls">

        <button id="loadPosts">Load Posts</button>

        <button id="createPost">Create Post</button>

        <button id="updatePost">PUT Update</button>

        <button id="patchPost">PATCH Update</button>

        <button id="deletePost">Delete Post</button>

    </section>
        <section class="form-section">
    <h2>Create a New Post</h2>

    <form id="postForm">
        <label for="title">Title</label>
        <input type="text" id="title" placeholder="Enter post title">

        <label for="body">Body</label>
        <textarea id="body" placeholder="Enter post body"></textarea>

        <label for="userId">User ID</label>
        <input type="number" id="userId" placeholder="Enter user ID">

        <button type="submit">Create Post</button>

        <p id="formMessage"></p>
    </form>
</section>

    <main id="posts"></main>

    <script src="script.js"></script>
</body>
</html>
